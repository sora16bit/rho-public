[project]
name = "rho-lang"
version = "0.1.0"
description = "Rho — experimental Japanese text analysis library and CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["sudachipy", "sudachidict_core"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rho = "rho.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rho*"]
